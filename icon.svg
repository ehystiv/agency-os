      <path d="M428 461H596M512 322V600M386 530H638" stroke-opacity="0.45" stroke-width="5"/>
    </g>
    <ellipse cx="512" cy="492" rx="74" ry="40" fill="#d6f3f6"/>
    <circle cx="512" cy="492" r="27" fill="#2fb8cc"/>
    <circle cx="512" cy="492" r="13" fill="#020406"/>
    <circle cx="502" cy="482" r="5" fill="#fff" opacity="0.9"/>
