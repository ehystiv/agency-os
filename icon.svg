      <path d="M100 236H924M100 412H924M100 588H924M100 764H924"/>
    </g>
  </g>

  <!-- Monitor '98: cornice grigia in rilievo con ombra -->
  <rect x="226" y="246" width="590" height="460" fill="#000" opacity="0.35" transform="translate(16 18)"/>
  <rect x="212" y="242" width="600" height="460" fill="#c6c9d1" stroke="#000" stroke-width="8"/>
  <path d="M220 694V250H804" fill="none" stroke="#f2f3f6" stroke-width="10"/>
  <path d="M220 694H804V250" fill="none" stroke="#6a6f7e" stroke-width="10"/>
  <rect x="254" y="284" width="516" height="376" fill="#6a6f7e"/>
  <rect x="262" y="292" width="500" height="360" fill="url(#screen_glow)"/>

