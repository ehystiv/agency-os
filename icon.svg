  <!-- Base del monitor e triangolo rosso dell'Agenzia sulla cornice -->
  <path d="M440 702h144l26 58H414z" fill="#9da2ae" stroke="#000" stroke-width="7"/>
  <rect x="352" y="756" width="320" height="34" fill="#c6c9d1" stroke="#000" stroke-width="7"/>
