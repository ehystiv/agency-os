<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="screen">
      <rect x="262" y="292" width="500" height="360"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#11244f"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </radialGradient>
    <radialGradient id="screen_glow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#0d1f2e"/>
      <stop offset="1" stop-color="#03060a"/>
    </radialGradient>
  </defs>

  <!-- Piastrella macOS: scrivania blu notte con il reticolo triangolare -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g stroke="#78aadc" stroke-opacity="0.13" stroke-width="3">
      <path d="M100 160L966 1660M100 -100L1100 1632M100 -360L1250 1632M100 -620L1400 1632M-60 160L900 1822M-220 160L740 1822"/>
