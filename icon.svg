      <rect x="262" y="348" width="500" height="4"/><rect x="262" y="372" width="500" height="4"/>
      <rect x="262" y="396" width="500" height="4"/><rect x="262" y="420" width="500" height="4"/>
      <rect x="262" y="444" width="500" height="4"/><rect x="262" y="468" width="500" height="4"/>
      <rect x="262" y="516" width="500" height="4"/><rect x="262" y="540" width="500" height="4"/>
      <rect x="262" y="564" width="500" height="4"/><rect x="262" y="588" width="500" height="4"/>
      <rect x="262" y="612" width="500" height="4"/><rect x="262" y="636" width="500" height="4"/>
