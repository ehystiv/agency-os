# Builds and publishes an update patch (.pck + update.json) when a version tag is pushed.
# See "Updates" in CLAUDE.md. The patch is built against the installer of the base
# version named in tools/release_base, downloaded from that version's release.
# When tools/release_base names this very version, it's a new base: the installer is
# exported here (tools/make_base.sh) and the patch comes out nearly empty, with base = version.
#
# Release a patch:   bump application/config/version, commit, then
#                    git tag -a v0.2.1 -m "Short notes shown in the app" && git push origin v0.2.1
# Release a base:    the same, with tools/release_base set to the new version in that commit.
# Try it:            Actions > Patch > Run workflow (dry run: the files end up as an artifact).
name: Patch

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build, don't publish"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  # From the release's SHA512-SUMS.txt: update them together with GODOT_VERSION.
  GODOT_SHA512: "38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca"
  TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot (cached)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos-verified

      - name: Download Godot and the macOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          echo "$GODOT_SHA512  godot.zip" | shasum -a 512 -c -
          unzip -q godot.zip && rm godot.zip
          # The full templates archive is 1.3 GB: keep only what a macOS export needs.
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA512  templates.tpz" | shasum -a 512 -c -
          unzip -q -j templates.tpz "templates/macos.zip" "templates/version.txt" -d templates
          rm templates.tpz

      - name: Install the export template
        run: |
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Version and notes
        id: meta
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME doesn't match application/config/version ($version)."
              exit 1
            fi
            # Annotated tag message = the notes shown in the Control panel.
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" | sed -e '/^-----BEGIN/,$d' > notes.txt
          fi
          touch notes.txt

      - name: Base installer
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          base_version=$(tr -d '[:space:]' < tools/release_base)
          mkdir -p base
          if [ "$base_version" = "$VERSION" ]; then
            # A new base: its installer is built here. --simple: no Finder automation on the runner.
            echo "new=true" >> "$GITHUB_OUTPUT"
            GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot" \
              tools/make_base.sh "base/AgencyOS-$VERSION.dmg" --simple
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            gh release download "v$base_version" --pattern "AgencyOS-*.dmg" --dir base
          fi

      - name: Build the patch
        run: |
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot" \
            tools/make_patch.sh base/AgencyOS-*.dmg out --notes "$(cat notes.txt)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patch-${{ steps.meta.outputs.version }}
          path: out/

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          NEW_BASE: ${{ steps.base.outputs.new }}
        run: |
          tag="v$VERSION"
          # The base installer goes along, so the latest release always has one:
          # a new user installs it and the app updates itself to this version.
          dmg=$(ls base/AgencyOS-*.dmg)
          if [ "$NEW_BASE" = "true" ]; then
            printf '\n\n---\n**This version needs the new installer:** download `%s` and drag the app to Applications, replacing the old one (first launch: right-click › Open). Campaigns and settings are kept.\n' "$(basename "$dmg")" >> notes.txt
          else
            printf '\n\n---\n**New installation:** download `%s` (drag the app to Applications; first launch: right-click › Open). On start the app updates itself to %s.\n' "$(basename "$dmg")" "$VERSION" >> notes.txt
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* "$dmg" --clobber
          else
            gh release create "$tag" out/* "$dmg" --verify-tag --title "AgencyOS 98 $VERSION" --notes-file notes.txt
          fi
